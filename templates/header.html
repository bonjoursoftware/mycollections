<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Web App</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; margin: 0; padding: 0; background-color: #f4f4f4; }
        .container { width: 80%; max-width: 800px; margin: auto; overflow: hidden; padding: 20px; }
        header { background: #333; color: #fff; padding-top: 20px; min-height: 60px; border-bottom: #77aaff 3px solid; }
        header a { color: #fff; text-decoration: none; text-transform: uppercase; font-size: 16px; }
        header ul { padding: 0; margin: 0; list-style: none; overflow: hidden; display: flex; align-items: center;}
        header li { padding: 0 20px; }
        header #branding { float: left; }
        header #branding h1 { margin: 0; }
        header nav { float: right; }
        .main-content { background: #fff; padding: 20px; margin-top: 20px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .error { color: #d9534f; background-color: #f2dede; border: 1px solid #ebccd1; padding: 10px; border-radius: 4px; }
        .success { color: #3c763d; background-color: #dff0d8; border: 1px solid #d6e9c6; padding: 10px; border-radius: 4px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { display: inline-block; padding: 10px 20px; background: #333; color: #fff; border: none; cursor: pointer; border-radius: 4px; font-size: 16px;}
        .btn:hover { background: #555; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div id="branding">
                <h1><a href="/">Go Web App</a></h1>
            </div>
            <nav>
                <ul>
                    {{ if .User }}
                        <li>Welcome, {{ .User.Name }}</li>
                        <li>
                            <form action="/logout" method="POST" style="display:inline;">
                                <button type="submit" style="background:none;border:none;color:white;cursor:pointer;text-transform:uppercase;font-size:16px;font-family:inherit;">Logout</button>
                            </form>
                        </li>
                    {{ else }}
                        <li><a href="/login">Login</a></li>
                        <li><a href="/register">Register</a></li>
                    {{ end }}
                </ul>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="main-content">
            {{ if .Error }}
                <div class="error">{{ .Error }}</div>
            {{ end }}
            {{ if .Success }}
                <div class="success">{{ .Success }}</div>
            {{ end }}
